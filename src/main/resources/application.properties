spring.application.name=leave-management

# ---------- PostgreSQL ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/leave_db
spring.datasource.username=postgres
# CHANGE THIS to your own PostgreSQL password
spring.datasource.password=password

# ---------- JPA / Hibernate ----------
# "update" creates new tables / columns automatically (never drops anything)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# (Hibernate detects the PostgreSQL dialect by itself, so no database-platform line is needed)
spring.jpa.open-in-view=true

# ---------- Server ----------
server.port=8080

# ---------- Public holidays (external source, NOT a database table) ----------
# Comma separated yyyy-MM-dd dates. These days are not counted as leave days
# (weekends are always excluded). Edit this list every year, or later replace
# WorkingDayService with a call to a real holiday API.
leave.public-holidays=2026-12-25,2027-01-01,2027-01-26
